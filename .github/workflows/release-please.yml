# Keeps the release pull request open, with the changelog from conventional commits. Merging it creates the release and
# its vX.Y.Z tag; the job build then makes the sdist and the wheel, and the job publish uploads them to PyPI by trusted
# publishing from the environment pypi, with attestations and no stored token. release-please runs with a GitHub App's
# token, because a tag pushed with GITHUB_TOKEN starts no workflow; the jobs are skipped until the variable
# RELEASE_PLEASE_APP_CLIENT_ID and the secret RELEASE_PLEASE_APP_PRIVATE_KEY are set.
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.1

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'muster-io/muster-bridge-python' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The sdist and the wheel of the release, built from its commit without a cache.
  build:
    name: build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # Trusted publishing: PyPI trusts this workflow in the environment pypi, which the maintainer limits to master.
  publish:
    name: publish
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/muster-bridge/${{ needs.release-please.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
